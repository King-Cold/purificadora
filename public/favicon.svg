<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fondo sólido corporativo Puritronic (sin degradados) -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#1E1545" />

  <!-- Dos órbitas minimalistas planas en azul corporativo -->
  <g stroke="#0071BA" stroke-width="5.2" stroke-linecap="round">
    <ellipse cx="50" cy="51" rx="31" ry="13.5" transform="rotate(-35 50 51)" />
    <ellipse cx="50" cy="51" rx="31" ry="13.5" transform="rotate(35 50 51)" />
  </g>

  <!-- Gota pura minimalista en blanco sólido -->
  <path
    d="M50 20C50 20 33.5 41 33.5 53.5C33.5 62.9 40.9 70.5 50 70.5C59.1 70.5 66.5 62.9 66.5 53.5C66.5 41 50 20 50 20Z"
    fill="#FFFFFF"
  />

  <!-- Destello mínimo plano dentro de la gota -->
  <path
    d="M42.8 48.5C41.4 51.8 41.4 55.6 43 58.6"
    stroke="#0071BA"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Punto rojo corporativo como detalle electrónico -->
  <circle cx="74" cy="31" r="5" fill="#E82147" />
</svg>
